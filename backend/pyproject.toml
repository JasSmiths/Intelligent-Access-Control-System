[project]
name = "intelligent-access-backend"
version = "0.1.0"
description = "Backend for an intelligent access control and presence system"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "alembic>=1.20.1",
    "aioesphomeapi>=45.6.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "aioesphomeapi>=46.30.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "apprise>=2.2.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "certifi>=2026.10.23",
    "cryptography>=50.0.2",
    "croniter>=7.0.0",
    "email-validator>=2.4.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "playwright>=1.65.2",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "python-json-logger>=4.2.0",
    "redis>=8.1.0",
    "rich>=15.0.0",
    "sqlalchemy[asyncio]>=2.0.58,<2.1",
    "uiprotect==25.5.0",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.4",
]

[project.optional-dependencies]
dev = [
    "mypy==2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff==0.17.6",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Keep the previous rules alongside Ruff 0.16 defaults.
extend-select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
