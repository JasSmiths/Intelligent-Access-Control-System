[project]
name = "intelligent-access-backend"
version = "0.1.0"
description = "Backend for an intelligent access control and presence system"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "alembic>=1.20.0",
    "aioesphomeapi>=45.6.2",
    "apprise>=2.0.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "croniter>=6.2.4",
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.1",
    "playwright>=1.63.0",
    "pydantic-settings>=2.15.0",
    "pyicloud>=2026.10.0",
    "python-multipart>=0.0.32",
    "python-json-logger>=4.2.0",
    "redis>=8.1.0",
    "rich>=15.0.0",
    "sqlalchemy[asyncio]>=2.0.54,<2.1",
    "uiprotect==23.1.2",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.2",
]

[project.optional-dependencies]
dev = [
    "mypy==2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff==0.17.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Keep the previous rules alongside Ruff 0.16 defaults.
extend-select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
