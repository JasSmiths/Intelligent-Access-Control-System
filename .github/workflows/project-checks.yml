name: Project Checks

on:
  workflow_dispatch:
    inputs:
      database_restore:
        description: Run the synthetic database restore rehearsal
        type: boolean
        default: false
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/validation/**"
      - "scripts/benchmarks/**"
      - "scripts/architecture/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/project-checks.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/validation/**"
      - "scripts/benchmarks/**"
      - "scripts/architecture/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/project-checks.yml"

permissions:
  contents: read

jobs:
  isolated-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      IACS_VALIDATION_BACKEND_IMAGE: iacs-backend:ci-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate source selection and required check classification
        run: |
          python3 scripts/validation/test_source_snapshot.py
          python3 scripts/validation/test_harness_configuration.py
      - name: Build backend runtime image
        run: docker build --target runtime -t iacs-backend:ci-runtime backend
      - name: Check final runtime PDF capability without source or dependency overlays
        run: >-
          python3 scripts/validation/runtime_pdf_smoke.py --image iacs-backend:ci-runtime
          --evidence-root "${{ runner.temp }}/iacs-runtime-pdf-evidence"
      - name: Run the same isolated locked checks as local development
        env:
          VALIDATION_EVENT: ${{ github.event_name }}
          DATABASE_RESTORE_REQUESTED: ${{ inputs.database_restore }}
        run: |
          restore_args=()
          if [[ "$VALIDATION_EVENT" == "workflow_dispatch" && "$DATABASE_RESTORE_REQUESTED" == "true" ]]; then
            restore_args+=(--database-restore)
          fi
          python3 scripts/validation/validate.py --mode full --allow-downloads \
            --evidence-root "${{ runner.temp }}/iacs-evidence" "${restore_args[@]}"
      - name: Select named validation evidence without test scratch
        if: always()
        run: >-
          python3 scripts/validation/ci_evidence.py
          --validation-root "${{ runner.temp }}/iacs-evidence"
          --runtime-root "${{ runner.temp }}/iacs-runtime-pdf-evidence"
          --output "${{ runner.temp }}/iacs-upload-evidence"
      - name: Retain commands, fingerprints and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolated-contract-evidence
          archive: true
          if-no-files-found: warn
          retention-days: 14
          path: ${{ runner.temp }}/iacs-upload-evidence

      - name: Identify the full result for local reuse
        id: full-receipt
        run: |
          name=$(python3 scripts/validation/ci_receipt.py name --root "$RUNNER_TEMP/iacs-evidence" --attempt "$GITHUB_RUN_ATTEMPT")
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Publish verified full-run receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.full-receipt.outputs.name }}
          archive: true
          path: ${{ runner.temp }}/iacs-evidence/iacs-validation-*/manifest.json
          if-no-files-found: error
          retention-days: 14

  dependency-audits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Audit the locked Python dependency set
        working-directory: backend
        run: |
          python -m pip install uv==0.13.9 pip-audit
          uv export --locked --extra dev --format requirements-txt --no-emit-project --no-hashes > "${{ runner.temp }}/iacs-requirements.txt"
          pip-audit --strict -r "${{ runner.temp }}/iacs-requirements.txt"
      - name: Audit the frontend lock
        working-directory: frontend
        run: npm audit --package-lock-only --audit-level=high

  image-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build backend development image
        run: docker build --target development -t iacs-backend:ci-development backend
      - name: Build frontend runtime image
        run: docker build --target runtime -t iacs-frontend:ci-runtime frontend
