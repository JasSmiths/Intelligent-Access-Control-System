name: Project Checks

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/phase1/**"
      - "scripts/architecture/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/backend-alfred.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/phase1/**"
      - "scripts/architecture/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/backend-alfred.yml"

permissions:
  contents: read

jobs:
  isolated-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PHASE1_BACKEND_IMAGE: iacs-backend:ci-runtime
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate source selection and required check classification
        run: |
          python3 scripts/phase1/test_source_snapshot.py
          python3 scripts/phase1/test_harness_configuration.py
      - name: Build backend runtime image
        run: docker build --target runtime -t iacs-backend:ci-runtime backend
      - name: Run the same isolated locked checks as local development
        run: >-
          python3 scripts/phase1/validate.py --mode full --allow-downloads
          --evidence-root "${{ runner.temp }}/iacs-evidence"
      - name: Retain commands, fingerprints and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-contract-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/iacs-evidence/*/*.json
            ${{ runner.temp }}/iacs-evidence/*/*.log
            ${{ runner.temp }}/iacs-evidence/*/artifacts/**

  dependency-audits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Audit the locked Python dependency set
        working-directory: backend
        run: |
          python -m pip install uv pip-audit
          uv export --locked --extra dev --format requirements-txt --no-emit-project --no-hashes > "${{ runner.temp }}/iacs-requirements.txt"
          pip-audit --strict -r "${{ runner.temp }}/iacs-requirements.txt"
      - name: Audit the frontend lock
        working-directory: frontend
        run: npm audit --package-lock-only --audit-level=high

  image-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build backend development image
        run: docker build --target development -t iacs-backend:ci-development backend
      - name: Build frontend runtime image
        run: docker build --target runtime -t iacs-frontend:ci-runtime frontend
